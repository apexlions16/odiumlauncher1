services:
  odium-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4178:4178"
    environment:
      ODIUM_PUBLIC_BASE_URL: ${ODIUM_PUBLIC_BASE_URL}
      ODIUM_ADMIN_TOKEN: ${ODIUM_ADMIN_TOKEN}
      ODIUM_CORS_ORIGIN: "*"
      ODIUM_DATA_DIR: /data
    volumes:
      - ./runtime-data:/data
